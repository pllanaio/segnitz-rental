name: Apply lifecycle tests

on:
  push:
    branches: [agent/order-payment-return-tests]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/order-payment-return-tests
          fetch-depth: 0

      - name: Apply prepared patch
        env:
          PATCH_GZIP_BASE64: 
        run: |
          printf '%s' "$PATCH_GZIP_BASE64" | base64 --decode | gzip --decompress > /tmp/lifecycle-tests.patch
          git apply --index /tmp/lifecycle-tests.patch
          git rm .github/workflows/apply-lifecycle-tests.yml
          git rm .github/workflows/repo-snapshot.yml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: cover order payment and return lifecycle"
          git push origin HEAD:agent/order-payment-return-tests
