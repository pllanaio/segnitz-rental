name: Publish verified release image

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful main-push CI run containing the reviewed image
        required: true
        type: string
      commit_sha:
        description: Full reviewed release commit (40 hexadecimal characters)
        required: true
        type: string
      image_digest:
        description: Reviewed OCI digest from release.json (sha256 followed by 64 hex characters)
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: docker-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish exact verified digest
    if: github.ref == 'refs/heads/main'
    environment: production-release
    permissions:
      contents: read
      actions: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_SHA: ${{ inputs.commit_sha }}
      RELEASE_DIGEST: ${{ inputs.image_digest }}
      RELEASE_RUN_ID: ${{ inputs.ci_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Verify reviewed commit remains main
        run: |
          test "$RELEASE_SHA" = "$(git rev-parse HEAD)"
          test "$RELEASE_SHA" = "$(git ls-remote origin refs/heads/main | cut -f1)"
      - name: Verify complete exact-commit gate and download immutable CI artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/fetch-release-evidence.js
      - name: Extract only expected evidence files
        run: |
          python3 - <<'PY'
          import pathlib, zipfile
          target = pathlib.Path('release-image')
          target.mkdir()
          expected = {'image.tar', 'build-metadata.json', 'release.json', 'trivy.json'}
          with zipfile.ZipFile('release-evidence/artifact.zip') as archive:
              if len(archive.namelist()) != len(expected) or set(archive.namelist()) != expected:
                  raise SystemExit('Unexpected release artifact contents')
              archive.extractall(target)
          PY
          node scripts/release-artifact.js verify release-image
      - name: Install registry copy tool
        run: sudo apt-get update && sudo apt-get install --no-install-recommends --yes skopeo
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: pllanaio
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Copy existing OCI bytes; refuse digest conversion
        run: |
          skopeo copy --all --preserve-digests --authfile "$HOME/.docker/config.json" \
            oci-archive:release-image/image.tar "docker://pllanaio/segnitz-rental:sha-$RELEASE_SHA"
          skopeo inspect --raw --authfile "$HOME/.docker/config.json" \
            "docker://pllanaio/segnitz-rental:sha-$RELEASE_SHA" > release-evidence/published-manifest.json
          ACTUAL_DIGEST="sha256:$(sha256sum release-evidence/published-manifest.json | cut -d ' ' -f1)"
          test "$ACTUAL_DIGEST" = "$RELEASE_DIGEST"
      - name: Sign and attest the scanned digest and its CI evidence
        run: |
          cosign sign --yes "pllanaio/segnitz-rental@$RELEASE_DIGEST"
          cosign attest --yes --type https://segnitz-rental.example/release/v1 \
            --predicate release-evidence/gate-evidence.json "pllanaio/segnitz-rental@$RELEASE_DIGEST"
          cosign verify --certificate-identity \
            https://github.com/pllanaio/segnitz-rental/.github/workflows/docker-publish.yml@refs/heads/main \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "pllanaio/segnitz-rental@$RELEASE_DIGEST" > release-evidence/signature-verification.json
          cp release-image/release.json release-evidence/release.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: published-release-evidence-${{ inputs.commit_sha }}
          path: |
            release-evidence/gate-evidence.json
            release-evidence/published-manifest.json
            release-evidence/signature-verification.json
            release-evidence/release.json
          retention-days: 90
          if-no-files-found: error
