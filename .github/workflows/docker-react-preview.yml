name: Publish React preview image

on:
  push:
    branches: [codex/nextjs-frontend-migration]

permissions:
  contents: read
  id-token: write

concurrency:
  group: docker-react-preview
  cancel-in-progress: true

jobs:
  publish:
    name: Build and push React preview
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: pllanaio
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push React preview
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: pllanaio/segnitz-rental:react
          cache-from: type=gha,scope=react-preview
          cache-to: type=gha,mode=max,scope=react-preview
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=https://github.com/pllanaio/segnitz-rental
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Sign the published image digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "pllanaio/segnitz-rental@$IMAGE_DIGEST"
