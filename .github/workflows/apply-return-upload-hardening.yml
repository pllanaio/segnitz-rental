name: Apply return upload hardening once

on:
  push:
    branches:
      - agent/runtime-hardening
    paths:
      - .github/workflows/apply-return-upload-hardening.yml

permissions:
  contents: write

jobs:
  apply-return-upload-hardening:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/runtime-hardening

      - name: Patch return image upload
        shell: python
        run: |
          from pathlib import Path

          path = Path('segnitz_rental.js')
          content = path.read_text(encoding='utf-8')

          old_import = "const multer = require('multer');"
          new_import = """const multer = require('multer');
          const { getSafeImageExtension, imageFileFilter } = require('./utils/uploads');"""

          old_uploads = """const productImageStorage = multer.diskStorage({
              destination: (req, file, cb) => {
                  cb(null, path.join(__dirname, 'public', 'img', 'products'));
              },
              filename: (req, file, cb) => {
                  const ext = path.extname(file.originalname).toLowerCase();
                  cb(null, `product_${Date.now()}_${Math.round(Math.random() * 1E9)}${ext}`);
              }
          });

          const returnImageStorage = multer.diskStorage({
              destination: (req, file, cb) => {
                  cb(null, path.join(__dirname, 'public', 'img', 'returns'));
              },
              filename: (req, file, cb) => {
                  const ext = path.extname(file.originalname).toLowerCase();
                  cb(null, `return_item_${req.params.itemId}_${Date.now()}_${Math.round(Math.random() * 1E9)}${ext}`);
              }
          });

          const uploadReturnImages = multer({
              storage: returnImageStorage,
              limits: {
                  fileSize: 5 * 1024 * 1024,
                  files: 10
              },
              fileFilter: (req, file, cb) => {
                  if (!file.mimetype.startsWith('image/')) {
                      return cb(new Error('Nur Bilddateien erlaubt.'));
                  }

                  cb(null, true);
              }
          });"""

          new_uploads = """const returnImageStorage = multer.diskStorage({
              destination: (req, file, cb) => {
                  cb(null, path.join(__dirname, 'public', 'img', 'returns'));
              },
              filename: (req, file, cb) => {
                  const extension = getSafeImageExtension(file.mimetype);

                  if (!extension) {
                      return cb(new Error('Ungültiger Bildtyp.'));
                  }

                  return cb(
                      null,
                      `return_item_${req.params.itemId}_${Date.now()}_${crypto.randomUUID()}${extension}`
                  );
              }
          });

          const uploadReturnImages = multer({
              storage: returnImageStorage,
              limits: {
                  fileSize: 5 * 1024 * 1024,
                  files: 10,
                  fields: 20,
                  parts: 30
              },
              fileFilter: imageFileFilter
          });"""

          if old_import not in content:
              raise SystemExit('Multer-Import nicht gefunden; Abbruch ohne Änderung.')
          if old_uploads not in content:
              raise SystemExit('Upload-Konfiguration nicht gefunden; Abbruch ohne Änderung.')

          content = content.replace(old_import, new_import, 1)
          content = content.replace(old_uploads, new_uploads, 1)
          path.write_text(content, encoding='utf-8')

      - name: Commit hardening and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add segnitz_rental.js
          git rm .github/workflows/apply-return-upload-hardening.yml
          git commit -m "Harden return image uploads"
          git push
