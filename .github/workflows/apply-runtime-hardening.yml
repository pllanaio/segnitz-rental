name: Apply runtime hardening once

on:
  push:
    branches:
      - agent/runtime-hardening
    paths:
      - .github/workflows/apply-runtime-hardening.yml

permissions:
  contents: write

jobs:
  apply-runtime-hardening:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/runtime-hardening

      - name: Patch server security setup
        shell: python
        run: |
          from pathlib import Path

          path = Path('segnitz_rental.js')
          content = path.read_text(encoding='utf-8')

          old_helmet = """require('dotenv').config();
          app.use(helmet({
              contentSecurityPolicy: false
          }));"""
          new_helmet = """require('dotenv').config();
          const {
              assertSecurityEnvironment,
              createHelmetOptions,
              createSessionCookieOptions
          } = require('./config/security');

          assertSecurityEnvironment();
          app.use(helmet(createHelmetOptions()));"""

          old_cookie = """    cookie: {
                  secure: false,
                  httpOnly: true,
                  sameSite: 'lax',
                  maxAge: 30 * 60 * 1000
              }"""
          new_cookie = """    cookie: createSessionCookieOptions()"""

          if old_helmet not in content:
              raise SystemExit('Helmet-Konfiguration nicht gefunden; Abbruch ohne Änderung.')
          if old_cookie not in content:
              raise SystemExit('Session-Cookie-Konfiguration nicht gefunden; Abbruch ohne Änderung.')

          content = content.replace(old_helmet, new_helmet, 1)
          content = content.replace(old_cookie, new_cookie, 1)
          path.write_text(content, encoding='utf-8')

      - name: Remove tracked dependencies
        run: git rm -r --ignore-unmatch node_modules

      - name: Commit hardening and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add segnitz_rental.js
          git rm .github/workflows/apply-runtime-hardening.yml
          git commit -m "Harden runtime security and remove tracked dependencies"
          git push
