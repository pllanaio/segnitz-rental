name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run syntax checks and unit tests
        run: npm run ci

  integration-test:
    name: MySQL integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4.11@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: segnitz_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PW: root
      DB_NAME: segnitz_test
      SESSION_SECRET: integration-test-session-secret-with-at-least-32-characters
      NODE_ENV: test
      DISABLE_PERIODIC_CLEANUP: 1
      TEST_PORT: 3101
      MOLLIE_TEST_MODE: 1
      DISABLE_EMAILS: 1

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run API and database integration tests
        run: npm run test:integration

  e2e-test:
    name: Playwright end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4.11@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: segnitz_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PW: root
      DB_NAME: segnitz_test
      SESSION_SECRET: playwright-test-session-secret-with-at-least-32-characters
      NODE_ENV: test
      DISABLE_PERIODIC_CLEANUP: 1
      E2E_PORT: 3102
      MOLLIE_TEST_MODE: 1
      DISABLE_EMAILS: 1

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare test database
        run: node test/support/test-database.js

      - name: Run browser tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 7

  dependency-audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Block high and critical production vulnerabilities
        run: npm run audit:prod

  codeql:
    permissions:
      contents: read
      security-events: write
    name: CodeQL security gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/autobuild@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd
      - uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd
        with:
          output: codeql-results
      - name: Reject high security findings
        run: node scripts/check-codeql.js codeql-results

  docker-build:
    name: Build and scan release image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - name: Build the sole release candidate, including SBOM and provenance
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          mkdir release-image
          docker buildx build --platform linux/amd64 --provenance=mode=max --sbom=true \
            --label "org.opencontainers.image.revision=$RELEASE_SHA" \
            --label org.opencontainers.image.source=https://github.com/pllanaio/segnitz-rental \
            --tag "pllanaio/segnitz-rental:sha-$RELEASE_SHA" \
            --output type=oci,dest=release-image/image.tar \
            --metadata-file release-image/build-metadata.json .
          node scripts/release-artifact.js create release-image
          python3 scripts/prepare-oci-scan.py release-image/image.tar release-scan
      - name: Scan the candidate OCI archive including unfixed high vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        env:
          TRIVY_LIST_ALL_PKGS: "true"
        with:
          input: release-scan
          list-all-pkgs: true
          format: json
          output: release-image/trivy.json
          exit-code: "1"
          ignore-unfixed: false
          severity: CRITICAL,HIGH
      - name: Summarize scan diagnostics without secret matches
        if: always()
        run: node scripts/release-artifact.js scan-summary release-image
      - name: Validate artifact and scan evidence
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: node scripts/release-artifact.js verify release-image
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-image-${{ github.sha }}
          path: release-image/
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

  release-gate:
    name: Release gate
    if: always()
    needs: [test, integration-test, e2e-test, dependency-audit, docker-build, codeql]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: All checks must succeed on this commit
        env:
          RELEASE_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/release-gate.js --needs
