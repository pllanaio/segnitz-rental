name: Repository snapshot

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create source snapshot
        run: |
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude='public/img/products/*' \
            --exclude='public/img/returns/*' \
            -czf segnitz-rental-source.tar.gz .

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: segnitz-rental-source
          path: segnitz-rental-source.tar.gz
          if-no-files-found: error
          retention-days: 1
