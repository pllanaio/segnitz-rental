<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Segnitz Rental - Mein Bereich</title>

    <!-- CSS -->
    <link rel="stylesheet" href="/vendor/bootstrap-5.3.8/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/bootstrap-icons-1.11.3/font/bootstrap-icons.min.css">
    <!--FAVICON-->
    <link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16x16.png">
    <link rel="manifest" href="img/site.webmanifest">
    <link rel="mask-icon" href="img/safari-pinned-tab.svg" color="#ffffff">
    <meta name="msapplication-TileColor" content="#ffffff">
    <meta name="theme-color" content="#ffffff">
<script src="/js/contact-contract.js" defer></script>
</head>

<body>

    <div id="globalAlertContainer" class="position-fixed top-0 start-50 translate-middle-x mt-3"
        style="z-index: 3000; width: 90%; max-width: 520px;"></div>

    <div class="container-fluid min-vh-100 p-0">
        <div class="row g-0 min-vh-100">

            <!-- SIDEBAR -->
            <aside class="col-12 col-md-3 col-xl-2 bg-primary text-white p-4">
                <div class="sidebar-brand text-center mb-4">
                    <img src="img/logo.png" alt="Segnitz Rental Logo" class="img-fluid sidebar-logo mb-3">

                    <h2 class="sidebar-title">Vermietung</h2>
                </div>

                <nav class="nav flex-column mt-4">
                    <button class="btn btn-outline-light text-start mb-2 active" id="nav-profile"
                        data-profile-view="profile">
                        <i class="bi bi-person-vcard"></i>
                        Meine Daten
                    </button>

                    <button class="btn btn-outline-light text-start mb-2" id="nav-orders"
                        data-profile-view="orders">
                        <i class="bi bi-receipt"></i>
                        Meine Bestellungen
                    </button>
                </nav>

                <a href="/index.html">
                    <button class="btn btn-light w-100 mt-4">
                        <i class="bi bi-arrow-left-circle"></i>
                        Mein Profil verlassen
                    </button>
                </a>

                <button class="btn btn-danger w-100 mt-2" id="profileLogoutButton">
                    <i class="bi bi-x-circle"></i>
                    Abmelden
                </button>
            </aside>

            <!-- CONTENT -->
            <main class="col-12 col-md-9 col-xl-10 p-4 p-lg-5">
                <div id="qbox-container_form">

                    <!-- MEINE DATEN -->
                    <div id="profileView">
                        <h4 class="mb-4">Meine Daten</h4>

                        <div id="profileError" class="alert alert-danger d-none"></div>

                        <div id="profileBox" class="card d-none">
                            <div class="card-body">

                                <form id="profileForm">
                                    <div class="row g-3">
                                        <div class="col-12 col-lg-6">
                                            <label for="customerNo" class="form-label">Kundennummer</label>
                                            <input type="text" id="customerNo" class="form-control" readonly>
                                        </div>

                                        <div class="col-12 col-lg-6">
                                            <label for="email" class="form-label">E-Mail</label>
                                            <input type="email" id="email" class="form-control" readonly>
                                        </div>

                                        <div class="col-12 col-lg-6">
                                            <label for="profileFirstName" class="form-label">Vorname</label>
                                            <input type="text" id="profileFirstName" class="form-control" required>
                                        </div>

                                        <div class="col-12 col-lg-6">
                                            <label for="profileLastName" class="form-label">Nachname</label>
                                            <input type="text" id="profileLastName" class="form-control" required>
                                        </div>

                                        <div class="col-12">
                                            <label for="profileCompany" class="form-label">Firma</label>
                                            <input type="text" id="profileCompany" class="form-control">
                                        </div>

                                        <div class="col-12 col-lg-6">
                                            <label for="profilePhone" class="form-label">Telefon</label>
                                            <input type="text" id="profilePhone" class="form-control" required>
                                        </div>

                                        <div class="col-12">
                                            <label for="profileAddress" class="form-label">Adresse</label>
                                            <input type="text" id="profileAddress" class="form-control" required>
                                        </div>

                                        <div class="col-12 col-lg-4">
                                            <label for="profileZip" class="form-label">PLZ</label>
                                            <input type="text" id="profileZip" class="form-control" required>
                                        </div>

                                        <div class="col-12 col-lg-8">
                                            <label for="profileCity" class="form-label">Ort</label>
                                            <input type="text" id="profileCity" class="form-control" required>
                                        </div>

                                        <div class="col-12">
                                            <label for="verified" class="form-label">E-Mail bestätigt</label>
                                            <input type="text" id="verified" class="form-control" readonly>
                                        </div>

                                        <div class="col-12">
                                            <button type="submit" class="btn btn-success">
                                                Daten speichern
                                            </button>
                                        </div>
                                    </div>
                                </form>

                                <hr class="my-4">

                                <h5>Passwort ändern</h5>

                                <form id="passwordForm">
                                    <div class="row g-3">
                                        <div class="col-12">
                                            <label for="currentPassword" class="form-label">Aktuelles Passwort</label>
                                            <input type="password" id="currentPassword" class="form-control" required>
                                        </div>

                                        <div class="col-12 col-lg-6">
                                            <label for="newPassword" class="form-label">Neues Passwort</label>
                                            <input type="password" id="newPassword" class="form-control" required>
                                        </div>

                                        <div class="col-12 col-lg-6">
                                            <label for="newPasswordConfirm" class="form-label">Neues Passwort wiederholen</label>
                                            <input type="password" id="newPasswordConfirm" class="form-control"
                                                required>
                                        </div>

                                        <div class="col-12">
                                            <button type="submit" class="btn btn-warning">
                                                Passwort ändern
                                            </button>
                                        </div>
                                    </div>
                                </form>

                            </div>
                        </div>
                    </div>

                    <!-- BESTELLUNGEN -->
                    <div id="ordersView" class="d-none">
                        <h4 class="mb-4">Meine Bestellungen</h4>
                        <div class="card mb-3">
                            <div class="card-body">
                                <div class="row g-2">
                                    <div class="col-12 col-md-3">
                                        <select id="myOrderYearFilter" class="form-select">
                                            <option value="">Alle Jahre</option>
                                        </select>
                                    </div>

                                    <div class="col-12 col-md-3">
                                        <select id="myOrderMonthFilter" class="form-select">
                                            <option value="">Alle Monate</option>
                                        </select>
                                    </div>

                                    <div class="col-12 col-md-2">
                                        <select id="myOrderStatusFilter" class="form-select">
                                            <option value="">Alle Status</option>
                                        </select>
                                    </div>

                                    <div class="col-12 col-md-2">
                                        <select id="myOrderReturnStatusFilter" class="form-select">
                                            <option value="">Alle Rückgabestatus</option>
                                        </select>
                                    </div>

                                    <div class="col-12 col-md-2">
                                        <select id="myOrderPaymentStatusFilter" class="form-select">
                                            <option value="">Alle Zahlungsstatus</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div id="myOrdersList">
                            <div class="alert alert-info">Bestellungen werden geladen...</div>
                        </div>
                    </div>

                </div>
            </main>

        </div>
    </div>

    <!-- MODAL -->
    <div class="modal fade" id="myOrderDetailsModal" tabindex="-1">
        <div class="modal-dialog modal-xl modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Bestelldetails</h5>
                    <button class="btn-close" aria-label="Schließen" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body" id="myOrderDetailsBody"></div>

                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">
                        Schließen
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="/vendor/bootstrap-5.3.8/bootstrap.bundle.min.js"></script>
    <script src="js/csrf.js"></script>
    <script src="js/safe_html.js"></script>
    <script src="js/alerts.js"></script>
    <script src="/js/pending-actions.js"></script>
    <script src="/js/finance-summary.js"></script>
    <script src="js/date_utils.js"></script>
    <script src="js/profile_config.js"></script>

</body>

</html>
