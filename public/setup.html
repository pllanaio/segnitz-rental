<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Segnitz Rental – Ersteinrichtung</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/bootstrap-icons-1.11.3/font/bootstrap-icons.min.css">
    <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32x32.png">
</head>

<body class="bg-light">
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-8 col-xl-6">
                <div class="text-center mb-4">
                    <img src="img/logo.png" alt="Segnitz Rental" class="img-fluid mb-3"
                        style="max-height: 88px;">
                    <h1 class="h3 mb-2">Ersteinrichtung</h1>
                    <p class="text-muted mb-0">
                        Die Datenbank ist bereit. Erstellen Sie jetzt das erste globale Adminkonto.
                    </p>
                </div>

                <div id="setupMessage" class="alert d-none" role="alert" aria-live="polite"></div>

                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4 p-md-5">
                        <div class="alert alert-info d-flex gap-3 align-items-start">
                            <i class="bi bi-shield-lock-fill fs-4" aria-hidden="true"></i>
                            <div>
                                <strong>Einmalig abgesichert</strong>
                                <div class="small mt-1">
                                    Den Einrichtungs-Code finden Sie im Deployment-Log oder im Wert von
                                    <code>ADMIN_SETUP_TOKEN</code>.
                                </div>
                            </div>
                        </div>

                        <form id="setupForm" novalidate>
                            <div class="mb-3">
                                <label for="setupToken" class="form-label">Einrichtungs-Code</label>
                                <input type="password" class="form-control" id="setupToken"
                                    autocomplete="one-time-code" required maxlength="512">
                            </div>

                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label for="firstName" class="form-label">Vorname</label>
                                    <input type="text" class="form-control" id="firstName"
                                        autocomplete="given-name" required maxlength="100">
                                </div>
                                <div class="col-md-6">
                                    <label for="lastName" class="form-label">Nachname</label>
                                    <input type="text" class="form-control" id="lastName"
                                        autocomplete="family-name" required maxlength="100">
                                </div>
                            </div>

                            <div class="mt-3">
                                <label for="email" class="form-label">Admin-E-Mail-Adresse</label>
                                <input type="email" class="form-control" id="email"
                                    autocomplete="username" required maxlength="254">
                            </div>

                            <div class="row g-3 mt-0">
                                <div class="col-md-6">
                                    <label for="password" class="form-label">Passwort</label>
                                    <input type="password" class="form-control" id="password"
                                        autocomplete="new-password" required minlength="12" maxlength="128">
                                </div>
                                <div class="col-md-6">
                                    <label for="passwordRepeat" class="form-label">Passwort wiederholen</label>
                                    <input type="password" class="form-control" id="passwordRepeat"
                                        autocomplete="new-password" required minlength="12" maxlength="128">
                                </div>
                            </div>

                            <div class="form-text mt-2">
                                Mindestens 12 Zeichen mit Groß- und Kleinbuchstaben, Zahl und Sonderzeichen.
                            </div>

                            <button type="submit" id="setupSubmit" class="btn btn-primary w-100 mt-4">
                                <i class="bi bi-person-check-fill me-1" aria-hidden="true"></i>
                                Adminkonto erstellen
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="js/setup_config.js"></script>
</body>

</html>
